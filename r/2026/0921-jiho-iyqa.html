<script type="application/json" id="report-data">{
  "school": "서초고",

  "comment": "마라톤국어 종현쌤 조교 김민서입니다!\n\n어느덧 수능까지 약 2달, 즉 8주 정도의 시간만 남았습니다.\n\n남은 기간을 수업 횟수로 생각해 보면 앞으로 함께할 수 있는 수업도 약 8번 정도밖에 남지 않았습니다. 이제부터는 매주 진행되는 수업과 과제 하나하나가 더욱 중요합니다.\n\n지금까지 공부해온 내용을 바탕으로 본인이 부족한 부분과 반복해서 틀리는 유형을 다시 점검하고, 수업에서 확인한 약점은 그때그때 바로 보완해 나가야 합니다. 특히 지금부터는 공부한 내용을 실제 시험에서 제대로 활용할 수 있도록 시간 관리와 문제 풀이 순서, 실전에서의 판단까지 함께 정리해 나가는 것이 중요합니다.\n\n수능까지 남은 8주는 길지 않습니다. 남은 기간 동안 매주 해야 할 공부를 미루지 않고 꾸준히 해나가면서, 지금까지 준비해온 내용을 제대로 마무리할 수 있도록 끝까지 최선을 다해 봅시다.\n\n이번 주 수업 보강영상은 아래 링크를 통해 확인해 주세요!\n\n이번 주 수업 일정과 다음 주 수업 및 과제는 아래 안내 페이지에서 확인해 주세요!\nhttps://marathonstudylive.oopy.io/\n\n이번 주 레포트에요, 확인 후 이상한 부분 있으면 연락주세요!"
}</script>

<script>
(function (global) {
  'use strict';

  var DAYS = ['월', '화', '수', '목', '금'];
  var root = document.getElementById('report-body');

  /* 선생님 표기·학원명·연락처는 ../../assets/brand.js 한 곳에 있다.
     그 파일을 못 불러왔을 때를 대비해 기본값을 둔다. */
  var B = global.BRAND || {
    reportBrand:  '김종현 국어',
    commentTitle: '김종현 종합 코멘트'
  };

  /* ---------- 유틸 ---------- */

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function pct(v) {
    var n = Math.round(Number(v) || 0);
    return n < 0 ? 0 : n > 100 ? 100 : n;
  }

  function intOf(v) {
    var n = Math.round(Number(v) || 0);
    return n < 0 ? 0 : n;
  }

  /* 2026-06-01 → '2026.06.01' */
  function formatDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || '').trim());
    return m ? m[1] + '.' + m[2] + '.' + m[3] : '';
  }

  /* 양쪽 모두 연도를 쓴다 → 2026.06.01 ~ 2026.06.05 */
  function formatPeriod(start, end) {
    var s = formatDate(start), e = formatDate(end);
    if (s && e) return s + ' ~ ' + e;
    return s || e || '';
  }

  /* 2026-06-01 → '6/1'  (탭 제목·카톡 제목용 짧은 형식) */
  function shortDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || '').trim());
    return m ? Number(m[2]) + '/' + Number(m[3]) : '';
  }

  /* → '6/1~6/5' */
  function shortPeriod(start, end) {
    var s = shortDate(start), e = shortDate(end);
    if (s && e) return s + '~' + e;
    return s || e || '';
  }

  /* '수업 1차시: 내용' → { no: '1차시', text: '내용' } */
  function splitLesson(raw, index) {
    var text = String(raw == null ? '' : raw).trim();
    var m = /^(?:수업\s*)?(\d+)\s*차시\s*[:：.\-]?\s*([\s\S]*)$/.exec(text);
    if (m && m[2].trim()) return { no: m[1] + '차시', text: m[2].trim() };
    return { no: (index + 1) + '차시', text: text };
  }

  function card(title, body, note) {
    return '<div class="card">' +
             '<h2 class="card-title">' + title +
               (note ? '<span class="card-note">' + esc(note) + '</span>' : '') +
             '</h2>' + body +
           '</div>';
  }

  /* ---------- 헤더 ---------- */

  function headerHtml(d) {
    var period = formatPeriod(d.startDate, d.endDate);
    return '' +
      '<div class="header">' +
        '<div class="header-emoji">📘</div>' +
        '<div class="header-title">' + esc(B.reportBrand) + '<br>주간 학습 레포트</div>' +
        (period ? '<div class="header-period num">📅 ' + esc(period) + '</div>' : '') +
      '</div>';
  }

  /* ---------- 학생 정보 ---------- */

  function studentHtml(d) {
    var rows = [['학교', d.school], ['학년', d.grade], ['이름', d.studentName]];
    var body = '<div class="student-info">' + rows.map(function (r) {
      return '<div class="info-item">' +
               '<div class="info-label">' + r[0] + '</div>' +
               '<div class="info-value">' + (esc(r[1]) || '-') + '</div>' +
             '</div>';
    }).join('') + '</div>';
    return card('📋 학생 정보', body);
  }

  /* ---------- 출결 ----------
     주 1회 수업이라 횟수를 세지 않고 상태 하나만 표시한다.
     출석 = 체크가 들어간 동그라미 / 지각 = 세모 / 결석 = 엑스 / 보강 = "보강 완료"
     지각·보강일 때는 note 에 짧은 메모를 넣을 수 있다. (선택)
     도형은 이모지 대신 SVG 로 그린다. 기기마다 모양이 달라지지 않게 하기 위함이다. */

  var MARKS = {
    /* 동그라미 색은 CSS 의 .att-box--attend .att-mark 에서 정한다 */
    attend:
      '<circle cx="29" cy="29" r="26" fill="currentColor"/>' +
      '<path d="M18 29.5 L26 37 L41 21" fill="none" stroke="#fff" stroke-width="4.6"' +
      ' stroke-linecap="round" stroke-linejoin="round"/>',
    late:
      '<path d="M29 9 L51 48 L7 48 Z" fill="currentColor" stroke="currentColor"' +
      ' stroke-width="6" stroke-linejoin="round"/>',
    absent:
      '<path d="M15 15 L43 43 M43 15 L15 43" fill="none" stroke="currentColor"' +
      ' stroke-width="7" stroke-linecap="round"/>',
    makeup:
      '<circle cx="29" cy="29" r="25" fill="none" stroke="currentColor" stroke-width="4.5"/>' +
      '<path d="M18 29.5 L26 37 L41 21" fill="none" stroke="currentColor" stroke-width="4.6"' +
      ' stroke-linecap="round" stroke-linejoin="round"/>',
    none:
      '<circle cx="29" cy="29" r="25" fill="none" stroke="currentColor" stroke-width="4.5"' +
      ' stroke-dasharray="5 7"/>'
  };

  var LABELS = {
    attend: '출석', late: '지각', absent: '결석',
    makeup: '보강 완료', none: '기록 없음'
  };

  /* 영문 키와 한글 값을 모두 받는다. 입력 폼은 버튼 네 개로 만들 예정이라
     'attend' 로 저장하든 '출석' 으로 저장하든 동작하게 둔다. */
  var STATUS_ALIAS = {
    attend: 'attend', 출석: 'attend',
    late:   'late',   지각: 'late',
    absent: 'absent', 결석: 'absent',
    makeup: 'makeup', 보강: 'makeup', 보강완료: 'makeup', '보강 완료': 'makeup'
  };

  function resolveStatus(a) {
    var key = STATUS_ALIAS[String(a.status || '').trim()];
    if (key) return key;

    /* 이전 스키마({ attend: 1, absent: 0, late: 0 }) 호환 */
    if (intOf(a.absent) > 0) return 'absent';
    if (intOf(a.late)   > 0) return 'late';
    if (intOf(a.attend) > 0) return 'attend';

    return 'none';
  }

  function attendanceHtml(d) {
    var a = d.attendance || {};
    var key = resolveStatus(a);
    var note = String(a.note == null ? '' : a.note).trim();

    var body = '' +
      '<div class="att-box att-box--' + key + '">' +
        '<div class="att-mark">' +
          '<svg viewBox="0 0 58 58" aria-hidden="true" focusable="false">' + MARKS[key] + '</svg>' +
        '</div>' +
        '<div class="att-state">' + LABELS[key] + '</div>' +
        (note ? '<div class="att-note">' + esc(note) + '</div>' : '') +
      '</div>';

    return card('📅 출결', body);
  }

  /* ---------- 이번주 학습 내용 ---------- */

  function lessonsHtml(d) {
    var list = (d.lessons || []).filter(function (l) { return String(l || '').trim(); });
    if (!list.length) return '';

    var body = '<ul class="lesson-list">' + list.map(function (raw, i) {
      var L = splitLesson(raw, i);
      return '<li class="lesson-item">' +
               '<span class="lesson-check">✓</span>' +
               '<span><b class="lesson-no">' + esc(L.no) + '</b>' + esc(L.text) + '</span>' +
             '</li>';
    }).join('') + '</ul>';

    return card('📖 이번주 학습 내용', body, '총 ' + list.length + '차시');
  }

  /* ---------- 수업 집중도 ---------- */

  function focusHtml(d) {
    var score = Math.max(0, Math.min(5, Math.round(Number(d.focusScore) || 0)));
    var stars = '';
    for (var i = 1; i <= 5; i++) {
      stars += '<span class="focus-star' + (i <= score ? ' active' : '') + '">★</span>';
    }
    var body = '<div class="focus-stars" aria-hidden="true">' + stars + '</div>' +
               '<div class="focus-score-text num">' + score + ' / 5 점</div>' +
               '<span class="sr-only">수업 집중도 5점 만점에 ' + score + '점</span>';
    return card('⭐ 수업 집중도', body);
  }

  /* ---------- 리뷰테스트 점수 ---------- */

  function testsHtml(d) {
    var list = (d.tests || []).filter(function (t) { return t && String(t.name || '').trim(); });
    if (!list.length) return '';

    var body = list.map(function (t) {
      var score = pct(t.score);
      var none = score === 0;               /* 0점 = 미응시 */
      return '<div class="test-item' + (none ? ' is-none' : '') + '">' +
               '<div class="test-header">' +
                 '<span class="test-name">' + esc(t.name) +
                   (none ? '<span class="test-badge">미응시</span>' : '') +
                 '</span>' +
                 '<span class="test-score-text num">' + score + ' <small>/ 100</small></span>' +
               '</div>' +
               '<div class="progress-bar">' +
                 '<div class="progress-fill" data-width="' + score + '"></div>' +
               '</div>' +
             '</div>';
    }).join('');

    return card('📝 리뷰테스트 점수', body);
  }

  /* ---------- 과제 수행 ---------- */

  /* ---------- 과제 ----------
     지금 방식 : 반 공통에 적은 항목마다 월~금 요일 체크
       homeworkItems [{key, group:'required'|'optional', name}]
       homework      {h1:{"월":true,"수":true}, h3:{}}

     어제 방식 : 항목마다 했는지만 (homework {h1:true})
       요일을 다시 체크하기 전까지 이 모양으로 그린다.
     옛 방식 : 월~금 요일 체크 (homework {"월":true,…}, 목록 없음)
     지난 주차를 다시 그릴 때를 위해 셋 다 읽는다. */

  function daysDone(v) {
    if (!v || typeof v !== 'object') return 0;
    return DAYS.filter(function (day) { return !!v[day]; }).length;
  }

  function itemDone(v) {
    return v === true || daysDone(v) > 0;
  }

  /* 요일 없이 '했다' 만 남은 항목이 있는가 */
  function isItemOnlyHomework(d) {
    var hw = d.homework || {};
    return (d.homeworkItems || []).some(function (it) { return hw[it.key] === true; });
  }

  function isLegacyHomework(d) {
    if ((d.homeworkItems || []).length) return false;
    var hw = d.homework || {};
    for (var i = 0; i < DAYS.length; i++) {
      if (Object.prototype.hasOwnProperty.call(hw, DAYS[i])) return true;
    }
    return false;
  }

  function legacyHomeworkHtml(d) {
    var hw = d.homework || {};
    var done = 0;

    var body = '<div class="homework-days">' + DAYS.map(function (day) {
      var ok = !!hw[day];
      if (ok) done++;
      return '<div class="hw-day">' +
               '<div class="hw-circle' + (ok ? ' done' : '') + '" aria-hidden="true">' +
                 (ok ? '✓' : '✗') +
               '</div>' +
               '<div class="hw-day-label">' + day + '</div>' +
               '<span class="sr-only">' + day + '요일 과제 ' + (ok ? '제출' : '미제출') + '</span>' +
             '</div>';
    }).join('') + '</div>';

    return card('✅ 과제 수행', body, done + ' / ' + DAYS.length + '일');
  }

  function hwGroupHtml(title, items, hw, kind) {
    if (!items.length) return '';
    var done = items.filter(function (it) { return itemDone(hw[it.key]); }).length;

    var rows = items.map(function (it) {
      var ok = itemDone(hw[it.key]);
      return '<li class="hw-item' + (ok ? ' is-done' : '') + '">' +
               '<span class="hw-mark" aria-hidden="true">' + (ok ? '✓' : '✗') + '</span>' +
               '<span class="hw-name">' + esc(it.name) + '</span>' +
               '<span class="sr-only">' + (ok ? '완료' : '미완료') + '</span>' +
             '</li>';
    }).join('');

    return '<div class="hw-group hw-group--' + kind + '">' +
             '<div class="hw-group__head">' +
               '<span class="hw-group__title">' + title + '</span>' +
               '<span class="hw-group__count num">' + done + ' / ' + items.length + '</span>' +
             '</div>' +
             '<ul class="hw-list">' + rows + '</ul>' +
           '</div>';
  }

  /* 지금 방식 — 항목 한 줄에 이름과 요일 동그라미 다섯.
     요일 글자는 묶음 제목 줄에 한 번만 적는다. */
  function hwDaysGroupHtml(title, items, hw, kind) {
    if (!items.length) return '';
    var done = 0;

    var rows = items.map(function (it) {
      var v = hw[it.key];
      var marks = [];
      var dots = DAYS.map(function (day) {
        var ok = !!(v && typeof v === 'object' && v[day]);
        if (ok) { done++; marks.push(day); }
        return '<span class="hwd-dot' + (ok ? ' done' : '') + '">' + (ok ? '✓' : '✗') + '</span>';
      }).join('');
      return '<li class="hwd-row">' +
               '<span class="hwd-name">' + esc(it.name) + '</span>' +
               '<span class="hwd-dots" aria-hidden="true">' + dots + '</span>' +
               '<span class="sr-only">' +
                 (marks.length ? marks.join('·') + '요일 제출' : '제출한 요일 없음') +
               '</span>' +
             '</li>';
    }).join('');

    return '<div class="hwd-group hwd-group--' + kind + '">' +
             '<div class="hwd-head">' +
               '<span class="hwd-title">' + title + '</span>' +
               '<span class="hwd-count num">' + done + ' / ' + (items.length * DAYS.length) + '</span>' +
               '<span class="hwd-days-label" aria-hidden="true">' +
                 DAYS.map(function (day) { return '<span>' + day + '</span>'; }).join('') +
               '</span>' +
             '</div>' +
             '<ul class="hwd-list">' + rows + '</ul>' +
           '</div>';
  }

  function homeworkHtml(d) {
    if (isLegacyHomework(d)) return legacyHomeworkHtml(d);

    var items = d.homeworkItems || [];
    if (!items.length) return '';

    var hw = d.homework || {};
    var req = items.filter(function (it) { return it.group !== 'optional'; });
    var opt = items.filter(function (it) { return it.group === 'optional'; });

    if (isItemOnlyHomework(d)) {
      var body = hwGroupHtml('필수과제', req, hw, 'required') +
                 hwGroupHtml('선택과제', opt, hw, 'optional');
      var done = items.filter(function (it) { return itemDone(hw[it.key]); }).length;
      return card('✅ 과제 수행', body, done + ' / ' + items.length + '개');
    }

    return card('✅ 과제 수행',
      hwDaysGroupHtml('필수과제', req, hw, 'required') +
      hwDaysGroupHtml('선택과제', opt, hw, 'optional'));
  }

  /* ---------- 과제 제출률 (원형 게이지) ---------- */

  function rateCircle(value, label) {
    var v = pct(value);
    var R = 45;
    var C = 2 * Math.PI * R;
    return '' +
      '<div class="rate-circle-wrapper' + (v === 0 ? ' is-zero' : '') + '">' +
        '<div class="rate-circle">' +
          '<svg viewBox="0 0 110 110" aria-hidden="true" focusable="false">' +
            '<circle class="rate-circle-bg" cx="55" cy="55" r="' + R + '" fill="none" stroke-width="10"/>' +
            '<circle class="rate-circle-fill" cx="55" cy="55" r="' + R + '" fill="none" stroke-width="10"' +
              ' stroke-dasharray="' + C.toFixed(2) + '"' +
              ' stroke-dashoffset="' + C.toFixed(2) + '"' +
              ' data-offset="' + (C - (v / 100) * C).toFixed(2) + '"/>' +
          '</svg>' +
          '<div class="rate-num num">' + v + '<small>%</small></div>' +
        '</div>' +
        '<div class="rate-label">' + esc(label) + '</div>' +
      '</div>';
  }

  function ratesHtml(d) {
    /* 옛 요일 방식 자료는 예전 그대로 두 게이지로 그린다 */
    if (isLegacyHomework(d)) {
      return card('📊 과제 제출률',
        '<div class="rate-grid">' +
          rateCircle(d.submitRate, '과제 제출률') +
          rateCircle(d.onTimeRate, '기한 준수율') +
        '</div>');
    }

    /* 항목이 있는 묶음만 그린다. -1 은 '그 묶음 자체가 없다' 는 뜻이다. */
    var parts = [];
    if (pctOrNull(d.requiredRate) !== null) {
      parts.push(rateCircle(d.requiredRate, '필수과제 제출률'));
    }
    if (pctOrNull(d.optionalRate) !== null) {
      parts.push(rateCircle(d.optionalRate, '선택과제 제출률'));
    }
    if (!parts.length) return '';

    return card('📊 과제 제출률',
      '<div class="rate-grid' + (parts.length === 1 ? ' rate-grid--one' : '') + '">' +
        parts.join('') +
      '</div>');
  }

  /* -1 이나 값이 없으면 null. 0 은 정상값이라 걸러내면 안 된다. */
  function pctOrNull(v) {
    var n = Number(v);
    if (v == null || isNaN(n) || n < 0) return null;
    return pct(n);
  }

  /* ---------- 종합 코멘트 ---------- */

  function commentHtml(d) {
    var text = String(d.comment == null ? '' : d.comment).trim();
    if (!text) return '';
    /* white-space: pre-wrap 이 줄바꿈을 그대로 유지한다 */
    var body = '<div class="comment-box">' +
                 '<span class="comment-quote-open" aria-hidden="true">“</span>' +
                 esc(text) +
                 '<span class="comment-quote-close" aria-hidden="true">”</span>' +
               '</div>';
    return card('✍️ ' + esc(B.commentTitle), body);
  }

  /* ---------- 진입 시 채움 애니메이션 ---------- */

  function animate() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        root.querySelectorAll('.progress-fill').forEach(function (el) {
          el.style.width = el.getAttribute('data-width') + '%';
        });
        root.querySelectorAll('.rate-circle-fill').forEach(function (el) {
          el.setAttribute('stroke-dashoffset', el.getAttribute('data-offset'));
        });
      });
    });
  }

  /* ---------- 실행 ---------- */

  try {
    var data = JSON.parse(document.getElementById('report-data').textContent);

    root.innerHTML =
      headerHtml(data) +
      studentHtml(data) +
      attendanceHtml(data) +
      lessonsHtml(data) +
      focusHtml(data) +
      testsHtml(data) +
      homeworkHtml(data) +
      ratesHtml(data) +
      commentHtml(data);

    /* head 의 <title> 과 같은 형식으로 맞춘다 → '김하늘 학생 · 6/1~6/5 레포트' */
    if (data.studentName) {
      var sp = shortPeriod(data.startDate, data.endDate);
      document.title = data.studentName + ' 학생 · ' + (sp ? sp + ' ' : '') + '레포트';
    }

    animate();
  } catch (e) {
    root.innerHTML = '<div class="empty">레포트를 불러오지 못했습니다.<br>선생님께 다시 확인 부탁드립니다.</div>';
  }
})(window);
</script>
</body>
</html>
